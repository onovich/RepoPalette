<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" data-style="ribbon" data-theme="paper" data-coding-mode="split" width="800" height="309" viewBox="0 0 800 309">
  <title id="title">Language Composition</title>
  <desc id="description">User-declared coding groups across 24 of 27 public repositories. Manual Coding is 22.0% of all language bytes; within this group: C#: 63.6%; ShaderLab: 36.4%. Vibe Coding is 78.0% of all language bytes; within this group: TypeScript: 53.8%; Python: 32.1%; Shell: 7.7%; HTML: 6.4%.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }

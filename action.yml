name: RepoPalette
author: onovich
description: Generate a validated GitHub language SVG and auditable JSON in your own repository.

inputs:
  style:
    description: "Visual layout: bars, orbit, constellation, ribbon, bead-halo, matrix, halo, treemap, voronoi, or prism."
    required: false
    default: bars
  theme:
    description: "Color theme: light, paper, midnight, aurora, terminal, or neon."
    required: false
    default: light
  username:
    description: GitHub account whose public, owned repositories are analyzed.
    required: false
    default: ${{ github.repository_owner }}
  github-token:
    description: GitHub API token. The automatic workflow token is used by default; no PAT is needed for public repositories.
    required: false
    default: ${{ github.token }}
  output-directory:
    description: Repository-relative directory for the generated SVG and audit JSON.
    required: false
    default: assets
  top:
    description: Number of languages displayed, from 1 to 12.
    required: false
    default: "6"
  include-archived:
    description: Include archived repositories in the statistics.
    required: false
    default: "false"
  exclude-repositories:
    description: Comma-separated repository names to exclude.
    required: false
    default: ""
  exclude-languages:
    description: Comma-separated language names to exclude.
    required: false
    default: ""
  title:
    description: Title rendered once at the top of the SVG.
    required: false
    default: Most Used Languages
  width:
    description: Base SVG width from 320 to 800 pixels. Split mode combines two panels into a 640 to 800 pixel card.
    required: false
    default: "400"
  show-branding:
    description: Show one small RepoPalette watermark in the SVG.
    required: false
    default: "true"
  coding-mode:
    description: "Programming-method display: off for one composition, or split for one combined Manual Coding and Vibe Coding view. Classification is always user-declared."
    required: false
    default: off
  manual-languages:
    description: "Comma-separated languages declared as manually coded when coding-mode is split. Every remaining language is placed in the Vibe Coding section."
    required: false
    default: ""
  manual-title:
    description: Manual section title when coding-mode is split.
    required: false
    default: Manual Coding
  vibe-title:
    description: Vibe section title when coding-mode is split.
    required: false
    default: Vibe Coding
  update-readme:
    description: Add or update a managed RepoPalette chart block in README.md.
    required: false
    default: "false"

outputs:
  svg-path:
    description: Absolute path to the generated SVG in both coding modes.
  manual-svg-path:
    description: Deprecated compatibility output; always empty because split mode now uses one SVG.
  vibe-svg-path:
    description: Deprecated compatibility output; always empty because split mode now uses one SVG.
  data-path:
    description: Absolute path to the generated audit JSON.
  readme-path:
    description: Absolute path to README.md when update-readme is enabled; otherwise empty.
  repository-count:
    description: Number of public, owned repositories returned by GitHub.
  included-repository-count:
    description: Number of repositories included after filters.
  language-count:
    description: Number of languages in the audit data.

runs:
  using: node24
  main: src/action.mjs

branding:
  icon: bar-chart-2
  color: purple
